[workspace]
resolver = "2"
members = ["src-tauri", "crates/afp-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Read the optimization guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
