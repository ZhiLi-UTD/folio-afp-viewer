name: CI

on:
  push:
    branches: [main, phase1-inspector]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Rust + front-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit deps (for tauri build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cargo test (workspace)
        run: cargo test --workspace

      - name: Clippy (afp-core)
        run: cargo clippy -p afp-core -- -D warnings

      - name: Front-end build
        run: |
          npm ci
          npm run build
