name: Release (Windows portable)

# Builds the portable Folio .exe on a Windows runner and attaches it to the
# GitHub Release for the pushed tag. Developers work on macOS; the signed/native
# Windows artifact is produced here rather than cross-compiled.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install front-end deps
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build

      # The portable executable (relies on the evergreen WebView2 runtime that
      # ships with Windows 10/11). The NSIS/MSI installers are also produced
      # under target/release/bundle if a full installer is ever wanted.
      - name: Collect portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-exe | Out-Null
          # The workspace target dir is at the repo root, not under src-tauri.
          Copy-Item target/release/folio.exe dist-exe/Folio.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows-portable
          path: dist-exe/Folio.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/Folio.exe
