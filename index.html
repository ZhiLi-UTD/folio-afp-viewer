<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app" class="app">
      <!-- Toolbar -->
      <header class="toolbar" data-tauri-drag-region>
        <div class="toolbar__lead">
          <span class="brand">Folio</span>
          <button id="open-btn" class="btn btn--primary">Open…</button>
          <span id="file-name" class="file-name" aria-live="polite"></span>
        </div>
        <div class="toolbar__trail">
          <div
            id="segmented"
            class="segmented"
            role="tablist"
            aria-label="View"
            hidden
          >
            <button class="segmented__item is-active" data-view="structure" role="tab">
              Structure
            </button>
            <button class="segmented__item" data-view="resources" role="tab">
              Resources
            </button>
            <button class="segmented__item" data-view="render" role="tab">
              Render
            </button>
          </div>
          <input
            id="search"
            class="search"
            type="search"
            placeholder="Search"
            aria-label="Search fields"
            hidden
          />
        </div>
      </header>

      <!-- Main three-pane body -->
      <main class="body">
        <!-- Empty / drop state -->
        <section id="empty" class="empty">
          <div class="empty__card">
            <div class="empty__glyph" aria-hidden="true">▤</div>
            <h1 class="empty__title">Open an AFP file</h1>
            <p class="empty__hint">
              Drag a <code>.afp</code> file here, or click Open to explore its
              structure, resources, and bytes.
            </p>
            <button id="empty-open" class="btn btn--primary btn--lg">Open…</button>
          </div>
        </section>

        <!-- Loaded document: inspector (structure / resources) -->
        <section id="workspace" class="workspace" hidden>
          <aside class="sidebar">
            <div id="source-list" class="source-list" role="tree" aria-label="Document"></div>
          </aside>

          <div class="detail">
            <div id="inspector" class="inspector"></div>
            <div class="hex">
              <div class="hex__head">
                <span id="hex-title" class="hex__title">Bytes</span>
              </div>
              <div id="hex-view" class="hex__view" role="group" aria-label="Hex bytes"></div>
            </div>
          </div>
        </section>

        <!-- Loaded document: page render -->
        <section id="render" class="render" hidden>
          <div class="render__bar">
            <div class="pager">
              <button id="page-prev" class="btn btn--icon" aria-label="Previous page">‹</button>
              <span id="page-indicator" class="pager__label">Page 1 / 1</span>
              <button id="page-next" class="btn btn--icon" aria-label="Next page">›</button>
            </div>
            <div class="zoomer">
              <button id="zoom-fit" class="btn">Fit</button>
              <button id="zoom-out" class="btn btn--icon" aria-label="Zoom out">−</button>
              <span id="zoom-label" class="zoomer__label">100%</span>
              <button id="zoom-in" class="btn btn--icon" aria-label="Zoom in">+</button>
              <button id="export-png" class="btn">Export PNG</button>
            </div>
          </div>
          <div id="render-desk" class="render__desk">
            <canvas id="page-canvas" class="page-canvas"></canvas>
          </div>
        </section>
      </main>

      <!-- Drag overlay -->
      <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-overlay__ring">Drop to open</div>
      </div>
    </div>
  </body>
</html>
